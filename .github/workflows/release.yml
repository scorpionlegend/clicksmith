name: Pre-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build target
        run: rustup target add ${{ matrix.target }}
      - name: Install Linux input and window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxtst-dev libxdo-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/clicksmith.exe -DestinationPath clicksmith-${{ matrix.platform }}.zip
      - name: Package macOS and Linux builds
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf clicksmith-${{ matrix.platform }}.tar.gz -C target/${{ matrix.target }}/release clicksmith
      - uses: actions/upload-artifact@v4
        with:
          name: clicksmith-${{ matrix.platform }}
          path: clicksmith-${{ matrix.platform }}.*

  publish:
    name: Publish GitHub pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clicksmith-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Clicksmith ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
