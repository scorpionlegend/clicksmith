[package]
name = "clicksmith"
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.88"
description = "A cross-platform mouse auto clicker written in Rust"
license = "MIT"
repository = "https://github.com/scorpionlegend/clicksmith"
keywords = ["autoclicker", "mouse", "automation", "egui"]
categories = ["gui", "os"]

[features]
package-managed = []
windows-nsis = ["package-managed", "dep:sha2"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
enigo = "0.6.1"
rdev = "0.5.3"
serde = { version = "1", features = ["derive"] }
self_update = { version = "1.3.3", default-features = false, features = ["github", "reqwest", "rustls", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "checksums"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
sha2 = { version = "0.10.9", optional = true }

[package.metadata.packager]
product-name = "Clicksmith"
identifier = "com.scorpionlegend.clicksmith"
publisher = "Scorpion Legend"
license-file = "LICENSE"
category = "Utility"
binaries = [{ path = "clicksmith", main = true }]
binaries-dir = "target/release"
out-dir = "target/packages"
icons = ["packaging/linux/clicksmith.png"]
resources = ["LICENSE"]

[package.metadata.packager.nsis]
installer-icon = "packaging/windows/clicksmith.ico"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/clicksmith", dest = "/usr/bin/clicksmith", mode = "755" },
    { source = "packaging/linux/clicksmith.desktop", dest = "/usr/share/applications/clicksmith.desktop", mode = "644" },
    { source = "packaging/linux/clicksmith.svg", dest = "/usr/share/icons/hicolor/scalable/apps/clicksmith.svg", mode = "644" },
]
