[package]
name = "rust-autoclicker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A cross-platform Rust mouse auto clicker"
license = "MIT"
repository = "https://github.com/scorpionlegend/rust-autoclicker"
keywords = ["autoclicker", "mouse", "automation", "egui"]
categories = ["gui", "os"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
enigo = "0.6.1"
rdev = "0.5.3"
