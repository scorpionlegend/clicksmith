[package]
name = "clicksmith"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "A cross-platform mouse auto clicker written in Rust"
license = "MIT"
repository = "https://github.com/scorpionlegend/clicksmith"
keywords = ["autoclicker", "mouse", "automation", "egui"]
categories = ["gui", "os"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
enigo = "0.6.1"
rdev = "0.5.3"
serde = { version = "1", features = ["derive"] }
self_update = { version = "1.3.3", default-features = false, features = ["github", "reqwest", "rustls", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "checksums"] }
